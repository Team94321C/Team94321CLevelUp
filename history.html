<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides Edit History</title>
<style>
:root{
  --bg:#f6f8fa; --panel:#fff; --border:#d0d7de; --text:#1f2328; --muted:#656d76; --accent:#0969da;
  --add:#1a7f37; --add-bg:#dafbe1; --del:#cf222e; --del-bg:#ffebe9; --mod:#9a6700; --mod-bg:#fff8c5;
  --fmt:#8250df; --fmt-bg:#fbefff; --move:#0969da; --move-bg:#ddf4ff; --note:#57606a; --note-bg:#eaeef2;
  --chip:#eff2f5; --hover:#f3f4f6; --g0:#ebedf0;
  /* chart series (validated categorical order: blue, orange, aqua, yellow, magenta) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --grid:#e6e8eb;
  --q1:#cde2fb; --q2:#86b6ef; --q3:#3987e5; --q4:#1c5cab;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8d96a0; --accent:#4493f8;
    --add:#3fb950; --add-bg:rgba(46,160,67,.2); --del:#f85149; --del-bg:rgba(248,81,73,.2);
    --mod:#d29922; --mod-bg:rgba(187,128,9,.2); --fmt:#a371f7; --fmt-bg:rgba(163,113,247,.2);
    --move:#4493f8; --move-bg:rgba(56,139,253,.2); --note:#8d96a0; --note-bg:rgba(110,118,129,.2);
    --chip:#21262d; --hover:#1c2128; --g0:#21262d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#262c34;
    --q1:#184f95; --q2:#1c5cab; --q3:#3987e5; --q4:#86b6ef;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
code{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--chip);padding:1px 4px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--panel);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 8px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#f9ab00,#e37400);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.deck{flex:1;min-width:200px}
.deck h1{font-size:20px;margin:0;font-weight:600;word-break:break-word}
.deck .sub{color:var(--muted);font-size:12px}
.btn{border:1px solid var(--border);background:var(--chip);border-radius:6px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:#1f883d;border-color:#1f883d;color:#fff}
.btn.danger{background:var(--del);border-color:var(--del);color:#fff}
.btn.sm{padding:2px 9px;font-size:12px}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;z-index:30;min-width:220px}
.menu .pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.menu .pop button:hover{background:var(--hover)}
.menu .pop small{display:block;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:#fd8c73;font-weight:600}
.tab .n{background:var(--chip);border-radius:20px;padding:0 7px;font-size:12px;margin-left:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 8px;align-items:center}
.filters select,.filters input,.field{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:5px 8px}
.filters input{flex:1;min-width:160px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--move-bg);color:var(--move);border-radius:20px;padding:2px 10px;font-size:12px}
.pill button{border:0;background:none;cursor:pointer;color:inherit;padding:0;font-size:14px}
.status{color:var(--muted);font-size:12px;padding:4px 0 12px}
.status.err{color:var(--del)}
.day{color:var(--muted);font-size:13px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.day::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--muted)}
.box{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.commit{border-top:1px solid var(--border)} .commit:first-child{border-top:0}
.commit.ver{background:linear-gradient(90deg,var(--note-bg),transparent 60%)}
.chead{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.chead:hover{background:var(--hover)}
.avs{display:flex;flex:none} .avs .av{margin-left:-8px;border:2px solid var(--panel)} .avs .av:first-child{margin-left:0}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.av.unsure{opacity:.75;outline:2px dashed var(--muted);outline-offset:1px}
.av.big{width:44px;height:44px;font-size:16px}
.av.sys{background:var(--note)!important}
.cmain{flex:1;min-width:0}
.ctitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmeta{color:var(--muted);font-size:12px}
.conf{font-size:11px;border-radius:20px;padding:0 6px;margin-left:4px;white-space:nowrap}
.conf.ok{background:var(--add-bg);color:var(--add)} .conf.share{background:var(--mod-bg);color:var(--mod)} .conf.prob{background:var(--note-bg);color:var(--note)}
.cright{display:flex;align-items:center;gap:6px;flex:none}
.sha{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.cnt{font:600 12px ui-monospace,monospace}
.cnt.add{color:var(--add)} .cnt.del{color:var(--del)} .cnt.mod{color:var(--mod)}
.chev{color:var(--muted);transition:transform .15s} .open .chev{transform:rotate(90deg)}
.cbody{display:none;border-top:1px solid var(--border);background:var(--bg);padding:10px 14px 14px}
.open .cbody{display:block}
.note-line{font-size:12px;color:var(--muted);margin-bottom:8px}
.slidegrp{background:var(--panel);border:1px solid var(--border);border-radius:6px;margin-top:10px}
.slidegrp:first-child{margin-top:0}
.sghead{padding:6px 12px;border-bottom:1px solid var(--border);font:600 13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--chip);border-radius:6px 6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sghead span.t{font-family:inherit;font-weight:400;color:var(--muted);flex:1}
.ch{padding:8px 12px;border-top:1px solid var(--border)} .ch:first-of-type{border-top:0}
.chline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;border-radius:20px;padding:1px 8px;white-space:nowrap}
.b-add{background:var(--add-bg);color:var(--add)} .b-del{background:var(--del-bg);color:var(--del)}
.b-mod{background:var(--mod-bg);color:var(--mod)} .b-fmt{background:var(--fmt-bg);color:var(--fmt)}
.b-move{background:var(--move-bg);color:var(--move)} .b-note{background:var(--note-bg);color:var(--note)}
.el{font-weight:600} .det{color:var(--muted)}
.diff{margin-top:6px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;background:var(--panel)}
.diff del{background:var(--del-bg);color:var(--del);text-decoration:line-through;border-radius:3px}
.diff ins{background:var(--add-bg);color:var(--add);text-decoration:none;border-radius:3px}
.diff.all-add{background:var(--add-bg)} .diff.all-del{background:var(--del-bg);text-decoration:line-through;color:var(--del)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* visual compare */
.cmp{padding:12px;border-bottom:1px solid var(--border);background:var(--bg)}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.cmp-grid{grid-template-columns:1fr}}
.cmp-side h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.frame{position:relative;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--panel)}
.frame img{display:block;width:100%;height:100%;object-fit:contain}
.frame .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:12px}
.hl{position:absolute;border:2px solid;border-radius:3px;pointer-events:auto}
.hl span{position:absolute;top:-1px;left:-1px;transform:translateY(-100%);font:600 10px/1.4 sans-serif;color:#fff;padding:0 4px;border-radius:3px 3px 0 0;white-space:nowrap}
.hl.add{border-color:var(--add);background:rgba(46,160,67,.12)} .hl.add span{background:var(--add)}
.hl.del{border-color:var(--del);background:rgba(248,81,73,.12)} .hl.del span{background:var(--del)}
.hl.mod,.hl.fmt{border-color:#d4a72c;background:rgba(212,167,44,.12)} .hl.mod span,.hl.fmt span{background:#9a6700}
.hl.move{border-color:var(--move);background:rgba(56,139,253,.1)} .hl.move span{background:var(--move)}
.hl.from{border-style:dashed;background:none}
.sketch{container-type:inline-size;background:#fff;color:#1f2328}
.sk{position:absolute;border:1px dashed #c9d1d9;border-radius:2px;overflow:hidden;color:#57606a}
.sk .tx{display:block;white-space:pre-wrap;word-break:break-word;line-height:1.25;padding:.4cqw .6cqw;font-size:2.1cqw}
.sk.k-title .tx{font-size:3.6cqw;font-weight:700} .sk.k-sub .tx{font-size:2.6cqw} .sk.k-table .tx{font-size:1.8cqw;font-family:ui-monospace,monospace}
.sk.k-img{background:repeating-linear-gradient(45deg,#eef2f6 0 6px,#e4eaf0 6px 12px);display:grid;place-items:center}
.sk.k-img::after{content:"🖼";font-size:3cqw;opacity:.6}
.sk.k-line{border-width:0;border-top:2px solid #8c959f;border-radius:0}
.sk.hot{border-width:2px;border-style:solid;color:#1f2328;overflow:visible;z-index:2}
.sk.hot .tag{position:absolute;top:-1px;left:-1px;transform:translateY(-100%);font:600 10px/1.4 sans-serif;color:#fff;padding:0 4px;border-radius:3px 3px 0 0;white-space:nowrap}
.sk.hot.add{border-color:#1a7f37;background:rgba(46,160,67,.10)} .sk.hot.add .tag{background:#1a7f37}
.sk.hot.del{border-color:#cf222e;background:rgba(248,81,73,.10)} .sk.hot.del .tag{background:#cf222e}
.sk.hot.mod,.sk.hot.fmt{border-color:#d4a72c;background:rgba(212,167,44,.12)} .sk.hot.mod .tag,.sk.hot.fmt .tag{background:#9a6700}
.sk.hot.move{border-color:#0969da;background:rgba(56,139,253,.08)} .sk.hot.move .tag{background:#0969da}
.sk.hot.from{border-style:dashed}
.sk.hot .tx{overflow:hidden;max-height:100%}
.live{margin-top:12px}
.live img{display:block;width:100%;max-width:560px;border:1px solid var(--border);border-radius:6px}
.cmp-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;align-items:center}
.cmp-legend i{display:inline-block;width:10px;height:10px;border:2px solid;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* cards / blame / people */
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;margin-bottom:14px}
.cardh{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cardh .t{font-weight:600;flex:1;min-width:150px}
.cardb{padding:12px 14px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:7px 14px;border-top:1px solid var(--border);align-items:center}
.brow:first-of-type{border-top:0}
.brow .who{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;justify-content:flex-end;flex-wrap:wrap}
.brow .who .av{width:20px;height:20px;font-size:9px}
.brow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow.child .lbl{padding-left:18px}
.brow.child .lbl::before{content:"└ ";color:var(--muted)}
.never{color:var(--muted);font-size:12px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.person{padding:14px}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.pname{font-weight:600;font-size:16px}
.stats{display:flex;gap:16px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.stats b{color:var(--text);font-size:14px}
.top3{font-size:12px;color:var(--muted);margin-top:8px}
/* versions */
.vrow{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
.vrow:first-of-type{border-top:0}
.vicon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--note-bg);flex:none}
.vicon.named{background:var(--move-bg)}
.vmain{flex:1;min-width:180px}
.vname{font-weight:600}
.vrow.hilite{background:var(--mod-bg)}
.savebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.savebar input{flex:1;min-width:200px}
.callout{background:var(--note-bg);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--text)}
/* stats + charts */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:600;line-height:1.1}
.kpi .k{color:var(--muted);font-size:12px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.charts .wide{grid-column:1 / -1}
@media (max-width:800px){.charts{grid-template-columns:1fr}}
.chart .cardh .t{font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg.viz{width:100%;height:auto;display:block}
svg.viz text{fill:var(--muted);font-size:11px}
svg.viz .gridl{stroke:var(--grid);stroke-width:1}
svg.viz .base{stroke:var(--border);stroke-width:1}
svg.viz .hit{fill:transparent;cursor:default}
svg.viz .hit:hover{fill:var(--hover);fill-opacity:.6}
.hb{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{display:flex;gap:2px;height:14px;align-items:stretch}
.hb .track i{display:block;height:100%;min-width:2px}
.hb .track i:last-child{border-radius:0 4px 4px 0}
.hb .val{font-variant-numeric:tabular-nums;color:var(--text);font-size:12px;text-align:right}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{border-bottom:1px solid var(--border);padding:5px 8px;text-align:left}
table.data td.n,table.data th.n{text-align:right;font-variant-numeric:tabular-nums}
#tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:50;display:none;max-width:260px}
#tip b{font-weight:600}
#tip .r{display:flex;gap:8px;justify-content:space-between}
#tip .r i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
/* welcome + modal */
.welcome{max-width:640px;margin:40px auto;padding:24px}
.welcome h2{margin-top:0}
.welcome input{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:8px 10px;margin:8px 0 12px}
.welcome ol{padding-left:20px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px}
.modal label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
.modal input{width:100%;margin-top:4px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal .msg{font-size:13px;margin-top:10px}
.modal .msg.err{color:var(--del)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">⎇</div>
      <div class="deck"><h1 id="deckTitle">Slides Edit History</h1><div class="sub" id="deckSub"></div></div>
      <div class="menu" id="exportMenu">
        <button class="btn" data-act="exportMenu">⬇ Export</button>
        <div class="pop hidden" id="exportPop">
          <button data-act="export" data-fmt="json">JSON<small>Everything, for backups or code</small></button>
          <button data-act="export" data-fmt="csv">CSV<small>Opens in Excel / Google Sheets</small></button>
        </div>
      </div>
      <button class="btn" data-act="refresh" title="Reload now">⟳</button>
      <button class="btn" data-act="settings" title="Change data source">⚙</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <div id="filters" class="filters hidden">
    <select id="fEditor"><option value="">All editors</option></select>
    <select id="fSlide"><option value="">All slides</option></select>
    <select id="fType">
      <option value="">All changes</option>
      <option value="add">Additions</option>
      <option value="del">Deletions</option>
      <option value="mod">Text edits</option>
      <option value="fmt">Formatting</option>
      <option value="move">Moves &amp; sizes</option>
      <option value="note">Checkpoints &amp; notes</option>
    </select>
    <input id="fQ" type="search" placeholder="Search text, objects, slides…">
    <span id="fEl"></span>
  </div>
  <div id="status" class="status"></div>
  <div id="view"></div>
</main>
<footer>While this page is open the deck is checked every 10 seconds; otherwise about once a minute.</footer>
<div id="tip"></div>
<div id="modalRoot"></div>

<script>
(function () {
'use strict';

/* Paste your Apps Script web app URL (ends in /exec) here to skip the setup screen. */
const DEFAULT_SOURCE = '';

const LS_KEY = 'slidesEditHistory.src';
const REFRESH_MS = 10000;

const TYPES = {
  TRACKING_STARTED:  ['Tracking started', 'note'],
  TRACKER_UPDATED:   ['Tracker updated', 'note'],
  CHECKPOINT:        ['Checkpoint', 'note'],
  RESTORED:          ['Restored', 'note'],
  DECK_RENAMED:      ['Renamed', 'mod'],
  SLIDE_ADDED:       ['Slide added', 'add'],
  SLIDE_DELETED:     ['Slide deleted', 'del'],
  SLIDE_MOVED:       ['Slide moved', 'move'],
  LAYOUT_CHANGED:    ['Layout', 'fmt'],
  BACKGROUND_CHANGED:['Background', 'fmt'],
  NOTES_EDITED:      ['Speaker notes', 'mod'],
  ELEMENT_ADDED:     ['Added', 'add'],
  ELEMENT_DELETED:   ['Deleted', 'del'],
  TEXT_EDITED:       ['Text edited', 'mod'],
  FORMAT_CHANGED:    ['Formatting', 'fmt'],
  IMAGE_CHANGED:     ['Image', 'fmt'],
  ELEMENT_CHANGED:   ['Changed', 'fmt'],
  MOVED:             ['Moved', 'move'],
  RESIZED:           ['Resized', 'move'],
  ROTATED:           ['Rotated', 'move'],
  GROUPING:          ['Grouping', 'move'],
};
const INTERNAL = new Set(['IMAGE', 'VERSION_REMOVED', 'VERSION_SAVED']);   // old auto-backups are hidden
/* chart series: fixed order, validated palette (blue, orange, aqua, yellow, magenta) */
const SERIES = [
  { key: 'mod',  name: 'Text edits',   color: 'var(--s1)' },
  { key: 'del',  name: 'Deletions',    color: 'var(--s2)' },
  { key: 'add',  name: 'Additions',    color: 'var(--s3)' },
  { key: 'fmt',  name: 'Formatting',   color: 'var(--s4)' },
  { key: 'move', name: 'Moves & sizes', color: 'var(--s5)' },
];
const TEXT_DIFF_TYPES = new Set(['TEXT_EDITED', 'NOTES_EDITED', 'DECK_RENAMED']);

const state = {
  src: '', demo: false, data: null, tab: 'history',
  f: { editor: '', slide: '', type: '', q: '', element: '' },
  expanded: new Set(), compare: new Set(), liveOpen: new Set(), firstLoad: true, loading: false,
  statsTable: false, lastRender: 0, busy: false,
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const typeOf = c => TYPES[c] || [c ? c.toLowerCase().replace(/_/g, ' ') : 'Change', 'fmt'];
const clsOf = c => typeOf(c)[1];
const splitPeople = s => String(s || '').split(/\s*,\s*/).filter(Boolean);
const uniq = a => [...new Set(a)];
const fmtN = n => Number(n).toLocaleString();
/** Fixes the "?" boxes: Shift+Enter breaks, symbol-font bullets and other invisible characters. */
function cleanText(s) {
  return String(s == null ? '' : s)
    .replace(/\u000b/g, '\n')
    .replace(/[-]/g, '•')
    .replace(/[\u0000-\u0008\u000c\u000e-\u001f\u007f￼�]/g, '');
}
function hashColor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return 'hsl(' + (h % 360) + ' 55% 45%)';
}
function initials(name) {
  const n = String(name || '?').replace(/@.*/, '').replace(/\(.*\)/, '').trim();
  const parts = n.split(/[\s._-]+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts.length === 1 ? [...parts[0]].slice(0, 2).join('') : [...parts[0]][0] + [...parts[parts.length - 1]][0]).toUpperCase();
}
function avatar(name, cls) {
  const sys = /^(Automatic|Unknown)$/.test(name);
  return '<span class="av ' + (cls || '') + (sys ? ' sys' : '') + '" style="background:' + hashColor(name) + '" title="' + esc(name) + '">' + (sys ? '⚙' : esc(initials(name))) + '</span>';
}
function ago(t) {
  if (!t) return '';
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 45) return 'just now';
  const m = Math.round(s / 60); if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' hour' + (h > 1 ? 's' : '') + ' ago';
  const d = Math.round(h / 24); if (d < 30) return d + ' day' + (d > 1 ? 's' : '') + ' ago';
  return new Date(t).toLocaleDateString();
}
const fullTime = t => t ? new Date(t).toLocaleString() : '';
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const slideName = r => r.slideNum ? 'Slide ' + r.slideNum : (r.slideId ? 'Slide' : 'Presentation');
function listNice(arr, word) { return arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' ' + (word || '&') + ' ' + arr[arr.length - 1]; }
function attribOf(r) {
  if (r.attrib) return r.attrib;
  return r.people.length === 1 ? 'confirmed' : 'shared';   // older edits: derive it
}
function parseGeo(g) { try { return g ? JSON.parse(g) : null; } catch (e) { return null; } }

/* ---------- word diff ---------- */
function tokenize(s) { return String(s).match(/\s+|[A-Za-z0-9_À-ɏ'’]+|[^\s]/gu) || []; }
function diffWords(a, b) {
  const A = tokenize(a), B = tokenize(b);
  let s = 0; while (s < A.length && s < B.length && A[s] === B[s]) s++;
  let e = 0; while (e < A.length - s && e < B.length - s && A[A.length - 1 - e] === B[B.length - 1 - e]) e++;
  const a2 = A.slice(s, A.length - e), b2 = B.slice(s, B.length - e);
  const ops = [];
  if (s) ops.push(['=', A.slice(0, s).join('')]);
  const n = a2.length, m = b2.length;
  if (n * m > 2500000) {
    if (n) ops.push(['-', a2.join('')]);
    if (m) ops.push(['+', b2.join('')]);
  } else {
    const W = m + 1, L = new Uint32Array((n + 1) * W);
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i * W + j] = a2[i] === b2[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a2[i] === b2[j]) { ops.push(['=', a2[i]]); i++; j++; }
      else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) { ops.push(['-', a2[i]]); i++; }
      else { ops.push(['+', b2[j]]); j++; }
    }
    while (i < n) ops.push(['-', a2[i++]]);
    while (j < m) ops.push(['+', b2[j++]]);
  }
  if (e) ops.push(['=', A.slice(A.length - e).join('')]);
  const merged = [];
  ops.forEach(o => { const last = merged[merged.length - 1]; if (last && last[0] === o[0]) last[1] += o[1]; else merged.push(o.slice()); });
  return merged;
}
function renderDiff(before, after) {
  return '<div class="diff">' + diffWords(before, after).map(([op, t]) =>
    op === '=' ? esc(t) : op === '-' ? '<del>' + esc(t) + '</del>' : '<ins>' + esc(t) + '</ins>').join('') + '</div>';
}

/* ---------- data ---------- */
function prepare(j) {
  const all = (j.rows || []).map((r, i) => Object.assign({}, r, {
    idx: i, t: Date.parse(r.time) || 0, people: splitPeople(r.editors),
    before: cleanText(r.before), after: cleanText(r.after), details: cleanText(r.details),
    element: cleanText(r.element), slideTitle: cleanText(r.slideTitle),
  }));
  // older versions saved "named versions" as deck copies; show them as checkpoints now
  all.forEach(r => { if (r.change === 'VERSION_SAVED' && r.before === 'named') { r.change = 'CHECKPOINT'; r.before = ''; } });
  const checkpoints = all.filter(r => r.change === 'CHECKPOINT');
  const rows = all.filter(r => !INTERNAL.has(r.change));
  const map = new Map();
  rows.forEach(r => {
    const k = r.commit || ('row' + r.idx);
    if (!map.has(k)) map.set(k, { id: k, t: r.t, people: r.people, attrib: attribOf(r), changes: [] });
    map.get(k).changes.push(r);
  });
  const commits = [...map.values()].sort((a, b) => a.t - b.t || a.changes[0].idx - b.changes[0].idx);
  commits.reverse();
  const people = uniq(rows.filter(r => clsOf(r.change) !== 'note').flatMap(r => r.people))
    .filter(p => !/^(Automatic|Unknown)$/.test(p)).sort((a, b) => a.localeCompare(b));
  return { deck: j.deck || {}, generated: j.generated, lastChecked: j.lastChecked, webActions: !!j.webActions,
           all, rows, commits, people, checkpoints, current: j.current || [] };
}

function matches(r) {
  const f = state.f;
  if (f.editor && !r.people.includes(f.editor)) return false;
  if (f.slide && r.slideId !== f.slide) return false;
  if (f.element && r.elementId !== f.element) return false;
  if (f.type && clsOf(r.change) !== f.type) return false;
  if (f.q) {
    const hay = [r.slideTitle, r.element, r.details, r.before, r.after, r.editors, typeOf(r.change)[0]].join(' ').toLowerCase();
    if (!hay.includes(f.q.toLowerCase())) return false;
  }
  return true;
}

function commitTitle(c) {
  const rs = c.changes.find(x => x.change === 'RESTORED');
  if (rs) return '↩ ' + rs.details;
  const cp = c.changes.find(x => x.change === 'CHECKPOINT');
  if (cp) return '📌 Checkpoint “' + cp.details + '”';
  const ts = c.changes.find(x => x.change === 'TRACKING_STARTED' || x.change === 'TRACKER_UPDATED');
  if (ts) return ts.details || 'Started tracking';
  const n = {};
  c.changes.forEach(x => { n[x.change] = (n[x.change] || 0) + 1; });
  const ph = [];
  const P = (k, one, many) => { if (n[k]) ph.push(n[k] === 1 ? one : many.replace('#', n[k])); };
  P('SLIDE_ADDED', 'added a slide', 'added # slides');
  P('SLIDE_DELETED', 'deleted a slide', 'deleted # slides');
  P('TEXT_EDITED', 'edited text', 'edited text in # places');
  P('ELEMENT_ADDED', 'added an object', 'added # objects');
  P('ELEMENT_DELETED', 'deleted an object', 'deleted # objects');
  P('SLIDE_MOVED', 'reordered slides', 'reordered slides');
  P('NOTES_EDITED', 'edited speaker notes', 'edited notes on # slides');
  P('MOVED', 'moved an object', 'moved # objects');
  P('RESIZED', 'resized an object', 'resized # objects');
  P('ROTATED', 'rotated an object', 'rotated # objects');
  P('FORMAT_CHANGED', 'changed formatting', 'changed formatting in # places');
  P('IMAGE_CHANGED', 'adjusted an image', 'adjusted # images');
  P('LAYOUT_CHANGED', 'changed a layout', 'changed # layouts');
  P('BACKGROUND_CHANGED', 'changed a background', 'changed # backgrounds');
  P('DECK_RENAMED', 'renamed the deck', 'renamed the deck');
  P('GROUPING', 'grouped objects', 'grouped objects');
  if (!ph.length) ph.push(c.changes.length + ' change' + (c.changes.length > 1 ? 's' : ''));
  let t = ph.slice(0, 3).join(', ') + (ph.length > 3 ? ' and more' : '');
  const nums = uniq(c.changes.map(x => x.slideNum).filter(Boolean)).sort((a, b) => a - b);
  if (nums.length) t += ' on slide' + (nums.length > 1 ? 's ' : ' ') + (nums.length > 5 ? nums.slice(0, 5).join(', ') + '…' : listNice(nums.map(String)));
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function whoLine(people, attrib) {
  const names = people.length ? people : ['Unknown'];
  if (attrib === 'shared' && names.length > 1)
    return '<b>' + esc(listNice(names, 'or')) + '</b><span class="conf share" title="Several people edited during the same check window, so we can’t tell which of them made each change.">same time window</span>';
  if (attrib === 'probable')
    return '<b>' + esc(names.join(', ')) + '</b><span class="conf prob" title="Google hadn’t listed this edit yet; this is the most recent editor.">probably</span>';
  if (/^(Automatic|Unknown)$/.test(names[0])) return '<b>' + esc(names[0]) + '</b>';
  return '<b>' + esc(listNice(names)) + '</b><span class="conf ok" title="Only this person edited during this window.">✓ confirmed</span>';
}

/* ---------- loading ---------- */
function getSource() {
  const qs = new URLSearchParams(location.search);
  if (qs.has('demo')) return 'demo';
  if (qs.get('src')) return qs.get('src');
  try { const s = localStorage.getItem(LS_KEY); if (s) return s; } catch (e) {}
  return DEFAULT_SOURCE;
}
function saveSource(s) { try { localStorage.setItem(LS_KEY, s); } catch (e) {} }
const withParams = (u, p) => u + (u.includes('?') ? '&' : '?') + p;

async function getJSON(url) {
  const res = await fetch(url, { redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  let j;
  try { j = JSON.parse(text); }
  catch (e) { throw new Error('The URL didn’t return history data. Check the web app is deployed with “Who has access: Anyone”.'); }
  if (j.error) throw new Error(j.error);
  return j;
}
async function postJSON(body) {
  if (state.demo) { await new Promise(r => setTimeout(r, 700)); return demoAction(body); }
  const res = await fetch(state.src, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' });
  const j = JSON.parse(await res.text());
  if (j.error) throw new Error(j.error);
  return j;
}

async function load(force) {
  if (state.loading) return;
  if (state.src === 'demo') {
    state.demo = true;
    if (!state.data) state.data = prepare(demoData());
    setStatus('Showing demo data — nothing here is real.');
    render(); return;
  }
  if (!state.src) { renderWelcome(); return; }
  state.loading = true;
  if (!state.data) setStatus('Loading history…');
  try {
    const j = await getJSON(withParams(state.src, 'check=1&_=' + Date.now()));
    const prev = state.data;
    state.data = prepare(j);
    if (j.checkError) setStatus('Live check failed: ' + j.checkError, true);
    else setStatus('Live · checked ' + new Date().toLocaleTimeString() + ' · updates every ' + (REFRESH_MS / 1000) + 's');
    if (force || !prev || prev.all.length !== state.data.all.length || Date.now() - state.lastRender > 60000) render();
  } catch (err) {
    const msg = (err && err.message) || String(err);
    setStatus('Couldn’t load: ' + (msg === 'Failed to fetch' ? 'network error, or the web app isn’t shared with “Anyone”.' : msg), true);
    if (!state.data) renderWelcome(msg);
  } finally {
    state.loading = false;
  }
}
function setStatus(t, err) { const el = $('#status'); el.textContent = t; el.className = 'status' + (err ? ' err' : ''); }

/* ---------- live preview (straight from Google, never saved) ---------- */
const liveCache = new Map();   // slideId -> {url, at}
function loadLive(slideId) {
  const hit = liveCache.get(slideId);
  if (hit && Date.now() - hit.at < 25 * 60000) return Promise.resolve(hit.url);   // Google's links last ~30 min
  const p = state.demo ? Promise.resolve(demoPreview(slideId))
    : getJSON(withParams(state.src, 'action=preview&slide=' + encodeURIComponent(slideId))).then(j => j.url);
  return p.then(url => { liveCache.set(slideId, { url, at: Date.now() }); return url; });
}
function fillLive(root) {
  (root || document).querySelectorAll('[data-live]').forEach(box => {
    if (box.dataset.done) return;
    box.dataset.done = '1';
    loadLive(box.dataset.live)
      .then(url => { box.innerHTML = '<img alt="Live preview of the slide" src="' + esc(url) + '">'; })
      .catch(e => { box.innerHTML = '<div class="never">Couldn’t load the live preview: ' + esc(e.message) + '</div>'; });
  });
}

/* ---------- rendering ---------- */
function render() {
  const d = state.data;
  if (!d) return;
  state.lastRender = Date.now();
  $('#deckTitle').innerHTML = d.deck.url
    ? '<a href="' + esc(d.deck.url) + '" target="_blank" rel="noopener">' + esc(d.deck.title || 'Untitled deck') + '</a>'
    : esc(d.deck.title || 'Slides Edit History');
  const edits = d.rows.filter(r => clsOf(r.change) !== 'note').length;
  $('#deckSub').textContent = d.rows.length
    ? fmtN(edits) + ' changes · ' + d.checkpoints.length + ' checkpoint' + (d.checkpoints.length === 1 ? '' : 's') + ' · ' + d.people.length + ' contributor' + (d.people.length === 1 ? '' : 's') + (state.demo ? ' · demo' : '')
    : 'No changes logged yet';
  renderTabs();
  renderFilters();
  $('#filters').classList.toggle('hidden', state.tab !== 'history');
  ({ history: renderHistory, checkpoints: renderCheckpoints, blame: renderBlame, people: renderPeople, stats: renderStats })[state.tab]();
  fillLive();
}

function renderTabs() {
  const d = state.data;
  const tabs = [['history', 'History', d.commits.length], ['checkpoints', 'Checkpoints', d.checkpoints.length],
                ['blame', 'Blame', d.current.length || ''], ['people', 'Contributors', d.people.length], ['stats', 'Stats', '']];
  $('#tabs').innerHTML = tabs.map(([k, label, n]) =>
    '<button class="tab' + (state.tab === k ? ' on' : '') + '" data-act="tab" data-tab="' + k + '">' + label +
    (n !== '' ? '<span class="n">' + n + '</span>' : '') + '</button>').join('');
}

function renderFilters() {
  const d = state.data, f = state.f;
  $('#fEditor').innerHTML = '<option value="">All editors</option>' +
    d.people.map(p => '<option' + (p === f.editor ? ' selected' : '') + '>' + esc(p) + '</option>').join('');
  const slides = [], seen = new Set();
  d.current.forEach(s => { seen.add(s.id); slides.push([s.id, 'Slide ' + s.num + ' · ' + cleanText(s.title)]); });
  const lastBySlide = new Map();
  d.rows.forEach(r => { if (r.slideId) lastBySlide.set(r.slideId, r); });
  lastBySlide.forEach((r, id) => {
    if (!seen.has(id)) slides.push([id, (r.change === 'SLIDE_DELETED' ? '(deleted) ' : '') + slideName(r) + ' · ' + r.slideTitle]);
  });
  $('#fSlide').innerHTML = '<option value="">All slides</option>' +
    slides.map(([id, label]) => '<option value="' + esc(id) + '"' + (id === f.slide ? ' selected' : '') + '>' + esc(label.length > 60 ? label.slice(0, 59) + '…' : label) + '</option>').join('');
  $('#fType').value = f.type;
  if ($('#fQ').value !== f.q) $('#fQ').value = f.q;
  if (f.element) {
    const r = [...d.rows].reverse().find(x => x.elementId === f.element);
    $('#fEl').innerHTML = '<span class="pill">Object: ' + esc(r ? r.element : f.element) + ' <button data-act="clearEl" title="Clear">×</button></span>';
  } else $('#fEl').innerHTML = '';
}

function renderHistory() {
  const d = state.data;
  if (!d.rows.length) { $('#view').innerHTML = '<div class="box empty">No changes yet. Edit the deck, wait a few seconds, then refresh.</div>'; return; }
  const commits = d.commits.map(c => Object.assign({}, c, { shown: c.changes.filter(matches) })).filter(c => c.shown.length);
  if (!commits.length) { $('#view').innerHTML = '<div class="box empty">Nothing matches these filters.</div>'; return; }
  if (state.firstLoad) { const first = commits.find(c => !c.changes.every(x => clsOf(x.change) === 'note')); if (first) state.expanded.add(first.id); state.firstLoad = false; }

  let html = '', curDay = '';
  commits.forEach(c => {
    const k = dayKey(c.t);
    if (k !== curDay) {
      if (curDay) html += '</div>';
      curDay = k;
      html += '<div class="day">Changes on ' + esc(new Date(c.t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })) + '</div><div class="box">';
    }
    html += renderCommit(c);
  });
  html += '</div>';
  $('#view').innerHTML = html;
}

function renderCommit(c) {
  const open = state.expanded.has(c.id);
  const isVer = c.changes.every(x => clsOf(x.change) === 'note');
  const add = c.shown.filter(x => clsOf(x.change) === 'add').length;
  const del = c.shown.filter(x => clsOf(x.change) === 'del').length;
  const mod = c.shown.filter(x => clsOf(x.change) !== 'note').length - add - del;
  const people = c.people.length ? c.people : ['Unknown'];
  const unsure = c.attrib !== 'confirmed';
  let h = '<div class="commit' + (open ? ' open' : '') + (isVer ? ' ver' : '') + '">' +
    '<div class="chead" role="button" tabindex="0" data-act="toggle" data-commit="' + esc(c.id) + '">' +
      '<span class="avs">' + people.slice(0, 3).map(p => avatar(p, unsure ? 'unsure' : '')).join('') + '</span>' +
      '<span class="cmain"><div class="ctitle">' + esc(commitTitle(c)) + '</div>' +
      '<div class="cmeta">' + whoLine(people, c.attrib) + ' · <span title="' + esc(fullTime(c.t)) + '">' + esc(ago(c.t)) + '</span></div></span>' +
      '<span class="cright">' +
        (add ? '<span class="cnt add">+' + add + '</span>' : '') +
        (del ? '<span class="cnt del">−' + del + '</span>' : '') +
        (mod > 0 ? '<span class="cnt mod">~' + mod + '</span>' : '') +
        '<span class="sha">' + esc(c.id.slice(0, 7)) + '</span>' + (isVer ? '' : '<span class="chev">›</span>') +
      '</span>' +
    '</div><div class="cbody">';
  if (open && !isVer) {
    if (c.attrib === 'shared') h += '<div class="note-line">⚠ ' + esc(listNice(people, 'and')) + ' were all editing during the same check window, so these changes can’t be split between them.</div>';
    const groups = new Map();
    c.shown.forEach(x => { const k = x.slideId || '_deck'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
    groups.forEach((list, sid) => {
      const r = list[0];
      const key = c.id + '|' + sid;
      const canCompare = sid !== '_deck' && list.some(x => clsOf(x.change) !== 'note');
      h += '<div class="slidegrp"><div class="sghead">' + esc(slideName(r)) +
        '<span class="t">' + (r.slideTitle ? '— ' + esc(r.slideTitle) : '') + '</span>' +
        (canCompare ? '<button class="btn sm" data-act="compare" data-key="' + esc(key) + '">' + (state.compare.has(key) ? 'Hide preview' : '🖼 Preview') + '</button>' : '') +
        '</div>' + (state.compare.has(key) ? renderCompare(c, sid, list) : '') + list.map(renderChange).join('') + '</div>';
    });
  }
  return h + '</div></div>';
}

function renderChange(x) {
  const [label, cls] = typeOf(x.change);
  let h = '<div class="ch"><div class="chline"><span class="badge b-' + cls + '">' + esc(label) + '</span>';
  if (x.element) h += '<span class="el">' + esc(x.element) + '</span>';
  if (x.details) h += '<span class="' + (cls === 'note' ? '' : 'det') + '">' + esc(x.details) + '</span>';
  if (x.elementId && cls !== 'note') h += '<button class="linkbtn" data-act="elHistory" data-el="' + esc(x.elementId) + '">history</button>';
  h += '</div>';
  if (TEXT_DIFF_TYPES.has(x.change) && (x.before || x.after)) h += renderDiff(x.before, x.after);
  else if ((x.change === 'ELEMENT_ADDED' || x.change === 'SLIDE_ADDED') && x.after) h += '<div class="diff all-add">' + esc(x.after) + '</div>';
  else if ((x.change === 'ELEMENT_DELETED' || x.change === 'SLIDE_DELETED') && x.before) h += '<div class="diff all-del">' + esc(x.before) + '</div>';
  return h + '</div>';
}

/* Before/after SKETCHES drawn from the saved data (no pictures are stored) */
function kindClass(kind) {
  const k = String(kind || '');
  if (/^Title/.test(k)) return 'k-title';
  if (/^Subtitle/.test(k)) return 'k-sub';
  if (/^(Image|Video|Sheets chart|Picture)/.test(k)) return 'k-img';
  if (/^Table/.test(k)) return 'k-table';
  if (/^Line/.test(k)) return 'k-line';
  return '';
}
function skBox(b, W, H, cls, kind, text, tag) {
  return '<div class="sk ' + kindClass(kind) + (cls ? ' hot ' + cls : '') + '" style="left:' + (b[0] / W * 100) + '%;top:' + (b[1] / H * 100) +
    '%;width:' + Math.max(.5, b[2] / W * 100) + '%;height:' + Math.max(.5, b[3] / H * 100) + '%">' +
    (tag ? '<b class="tag">' + esc(tag) + '</b>' : '') + (text ? '<span class="tx">' + esc(cleanText(text)) + '</span>' : '') + '</div>';
}
function renderCompare(c, slideId, list) {
  const d = state.data;
  const W = d.deck.pageW || 720, H = d.deck.pageH || 405;
  const cur = d.current.find(s => s.id === slideId);
  const added = list.some(x => x.change === 'SLIDE_ADDED'), deleted = list.some(x => x.change === 'SLIDE_DELETED');
  const curEl = new Map(((cur && cur.elements) || []).map(e => [e.id, e]));
  // one entry per changed object, merging its changes in this save
  const objs = new Map();
  list.forEach(x => {
    if (!x.elementId) return;
    const g = parseGeo(x.geo) || {};
    const o = objs.get(x.elementId) || { kind: (curEl.get(x.elementId) || {}).kind || String(x.element).replace(/\s*".*$/, ''), b: null, a: null, tb: null, ta: null, cls: [], labels: [] };
    if (g.b) o.b = g.b; if (g.a) o.a = g.a;
    if (TEXT_DIFF_TYPES.has(x.change) || x.change === 'ELEMENT_DELETED') o.tb = x.before;
    if (TEXT_DIFF_TYPES.has(x.change) || x.change === 'ELEMENT_ADDED') o.ta = x.after;
    o.cls.push(clsOf(x.change)); o.labels.push(typeOf(x.change)[0]);
    objs.set(x.elementId, o);
  });
  const ctx = [...curEl.values()].filter(e => e.box && e.kind !== 'Group' && !objs.has(e.id))
    .map(e => skBox(e.box, W, H, '', e.kind, e.text, '')).join('');
  const side = which => {
    let h = ctx, drawn = 0;
    objs.forEach((o, id) => {
      const nowText = (curEl.get(id) || {}).text || '';
      const tag = uniq(o.labels).join(' + ');
      const main = o.cls.includes('add') ? 'add' : o.cls.includes('del') ? 'del' : o.cls.includes('mod') ? 'mod' : o.cls.includes('move') ? 'move' : 'fmt';
      if (which === 'b' && o.b && main !== 'add') { h += skBox(o.b, W, H, main + (main === 'move' ? ' from' : ''), o.kind, o.tb != null ? o.tb : nowText, tag + (main === 'move' ? ' (was here)' : '')); drawn++; }
      if (which === 'a' && o.a && main !== 'del') { h += skBox(o.a, W, H, main, o.kind, o.ta != null ? o.ta : nowText, tag); drawn++; }
    });
    return { h, drawn };
  };
  const frame = (inner, empty) => '<div class="frame sketch" style="aspect-ratio:' + W + '/' + H + '">' + (empty ? '<div class="ph">' + empty + '</div>' : inner) + '</div>';
  const B = side('b'), A = side('a');
  const noGeo = objs.size && !B.drawn && !A.drawn;
  const delText = deleted ? (list.find(x => x.change === 'SLIDE_DELETED') || {}).before : '';
  const html = '<div class="cmp"><div class="cmp-grid">' +
    '<div class="cmp-side"><h4><span>Before</span><span>sketch</span></h4>' +
      frame(B.h, added ? 'This slide didn’t exist yet.' : deleted ? '<div style="white-space:pre-wrap;text-align:left">' + esc(delText || '(empty slide)') + '</div>' : '') + '</div>' +
    '<div class="cmp-side"><h4><span>After</span><span>sketch</span></h4>' +
      frame(A.h, deleted ? 'This slide was deleted.' : '') + '</div>' +
    '</div><div class="cmp-legend"><span><i style="border-color:var(--add)"></i>added</span><span><i style="border-color:var(--del)"></i>deleted</span>' +
    '<span><i style="border-color:#d4a72c"></i>edited / formatted</span><span><i style="border-color:var(--move)"></i>moved / resized (dashed = old spot)</span>' +
    '<span>Drawn from the saved data. Objects that didn’t change here are shown as they are now.' + (noGeo ? ' (Older edits have no position data, so they can’t be drawn.)' : '') + '</span></div>' +
    (cur && !deleted
      ? (state.liveOpen.has(c.id + '|' + slideId)
          ? '<div class="live"><h4 style="margin:0 0 6px;font-size:12px;color:var(--muted)">How the slide looks right now — live from Google, not saved</h4><div data-live="' + esc(slideId) + '"><div class="never">Loading…</div></div></div>'
          : '<div class="live"><button class="btn sm" data-act="live" data-key="' + esc(c.id + '|' + slideId) + '">📷 Show the real slide as it looks now</button></div>')
      : '') + '</div>';
  return html;
}

/* ---------- Blame ---------- */
function renderBlame() {
  const d = state.data;
  const rows = d.rows.filter(r => clsOf(r.change) !== 'note');
  const lastEl = new Map(), countEl = new Map(), lastSlide = new Map(), created = new Map(), notes = new Map();
  rows.forEach(r => {
    if (r.elementId) { lastEl.set(r.elementId, r); countEl.set(r.elementId, (countEl.get(r.elementId) || 0) + 1); }
    if (r.slideId) {
      lastSlide.set(r.slideId, r);
      if (r.change === 'SLIDE_ADDED') created.set(r.slideId, r);
      if (r.change === 'NOTES_EDITED') notes.set(r.slideId, r);
    }
  });
  const who = r => r
    ? '<span class="who">' + r.people.slice(0, 2).map(p => avatar(p, attribOf(r) !== 'confirmed' ? 'unsure' : '')).join('') + whoLine(r.people, attribOf(r)) + ' · ' +
      '<span class="badge b-' + clsOf(r.change) + '">' + esc(typeOf(r.change)[0]) + '</span> · <span title="' + esc(fullTime(r.t)) + '">' + esc(ago(r.t)) + '</span></span>'
    : '<span class="who never">unchanged since tracking started</span>';

  let slides = d.current;
  if (!slides.length) {
    const tmp = new Map();
    rows.forEach(r => {
      if (!r.slideId) return;
      if (r.change === 'SLIDE_DELETED') { tmp.delete(r.slideId); return; }
      const s = tmp.get(r.slideId) || { id: r.slideId, elements: new Map() };
      s.num = r.slideNum; s.title = r.slideTitle;
      if (r.elementId) { if (r.change === 'ELEMENT_DELETED') s.elements.delete(r.elementId); else s.elements.set(r.elementId, { id: r.elementId, label: r.element }); }
      tmp.set(r.slideId, s);
    });
    slides = [...tmp.values()].map(s => Object.assign(s, { elements: [...s.elements.values()] })).sort((a, b) => a.num - b.num);
  }
  if (!slides.length) { $('#view').innerHTML = '<div class="box empty" style="margin-top:16px">No slides to show yet.</div>'; return; }

  let html = '<p class="status" style="padding-top:16px">Who last touched each slide and object, like <code>git blame</code>. Dashed avatars = not confirmed (several people were editing at once).</p>';
  slides.forEach(s => {
    const last = lastSlide.get(s.id), cr = created.get(s.id);
    html += '<div class="card"><div class="cardh"><span class="t">Slide ' + s.num + ' — ' + esc(cleanText(s.title)) + '</span>' +
      '<span class="never">' + (cr ? 'created by <b>' + esc(listNice(cr.people)) + '</b> ' + esc(ago(cr.t)) + ' · ' : '') +
      (last ? 'last change ' + esc(ago(last.t)) : 'no changes yet') + '</span>' +
      '<button class="linkbtn" data-act="slideHistory" data-slide="' + esc(s.id) + '">history</button></div>';
    (s.elements || []).forEach(e => {
      const r = lastEl.get(e.id), n = countEl.get(e.id) || 0;
      html += '<div class="brow' + (e.parent ? ' child' : '') + '"><span class="lbl" title="' + esc(cleanText(e.label)) + '">' + esc(cleanText(e.label)) +
        (n ? ' <button class="linkbtn" data-act="elHistory" data-el="' + esc(e.id) + '">history (' + n + ')</button>' : '') + '</span>' + who(r) + '</div>';
    });
    if (notes.has(s.id)) html += '<div class="brow"><span class="lbl">Speaker notes</span>' + who(notes.get(s.id)) + '</div>';
    if (!(s.elements || []).length && !notes.has(s.id)) html += '<div class="brow"><span class="lbl never">Empty slide</span><span></span></div>';
    html += '</div>';
  });
  const currentIds = new Set(slides.map(s => s.id));
  const deleted = rows.filter(r => r.change === 'SLIDE_DELETED' && !currentIds.has(r.slideId));
  if (deleted.length) {
    html += '<div class="card"><div class="cardh"><span class="t">Deleted slides</span></div>' +
      deleted.slice().reverse().map(r => '<div class="brow"><span class="lbl">' + esc(r.slideTitle || '(untitled)') +
        ' <button class="linkbtn" data-act="slideHistory" data-slide="' + esc(r.slideId) + '">history</button></span>' + who(r) + '</div>').join('') + '</div>';
  }
  $('#view').innerHTML = html;
}

/* ---------- Contributors ---------- */
function perPerson() {
  const d = state.data;
  const per = new Map();
  d.rows.filter(r => clsOf(r.change) !== 'note').forEach(r => {
    const a = attribOf(r);
    r.people.filter(p => !/^(Automatic|Unknown)$/.test(p)).forEach(p => {
      if (!per.has(p)) per.set(p, { name: p, n: 0, confirmed: 0, shared: 0, probable: 0, commits: new Set(), slides: new Map(), first: r.t, last: r.t, cls: {} });
      const o = per.get(p);
      o.n++; o[a === 'confirmed' ? 'confirmed' : a === 'probable' ? 'probable' : 'shared']++;
      o.commits.add(r.commit); o.last = Math.max(o.last, r.t); o.first = Math.min(o.first, r.t);
      if (r.slideId) o.slides.set(r.slideId, { n: ((o.slides.get(r.slideId) || {}).n || 0) + 1, label: slideName(r) + ' “' + r.slideTitle + '”' });
      const c = clsOf(r.change); o.cls[c] = (o.cls[c] || 0) + 1;
    });
  });
  return [...per.values()].sort((a, b) => b.n - a.n);
}

function renderPeople() {
  const list = perPerson();
  let html = '<p class="status" style="padding-top:16px"><b>Confirmed</b> = they were the only person editing in that check window. ' +
    '<b>Same window</b> = several people were editing at once, so it might have been any of them.</p>';
  if (!list.length) html += '<div class="box empty">No contributions yet.</div>';
  html += '<div class="people">' + list.map(p => {
    const topSlides = [...p.slides.values()].sort((a, b) => b.n - a.n).slice(0, 3).map(s => esc(s.label) + ' (' + s.n + ')').join(', ');
    const max = Math.max(1, p.n);
    return '<div class="card person"><div class="phead">' + avatar(p.name, 'big') + '<div><div class="pname">' + esc(p.name) + '</div>' +
      '<div class="never">active ' + esc(ago(p.first)) + ' → ' + esc(ago(p.last)) + '</div></div></div>' +
      '<div class="stats"><span><b>' + p.confirmed + '</b> confirmed</span><span><b>' + (p.shared + p.probable) + '</b> same window / probable</span><span><b>' + p.slides.size + '</b> slides</span></div>' +
      '<div class="hb" style="grid-template-columns:1fr;margin:10px 0 4px"><div class="track">' +
        (p.confirmed ? '<i style="width:' + (p.confirmed / max * 100) + '%;background:var(--s1)" data-tip="<b>' + p.confirmed + '</b> confirmed changes"></i>' : '') +
        (p.shared + p.probable ? '<i style="width:' + ((p.shared + p.probable) / max * 100) + '%;background:var(--s2)" data-tip="<b>' + (p.shared + p.probable) + '</b> same window / probable"></i>' : '') +
      '</div></div>' +
      '<div class="legend"><span><i style="background:var(--s1)"></i>Confirmed</span><span><i style="background:var(--s2)"></i>Same window / probable</span></div>' +
      (topSlides ? '<div class="top3">Most edited: ' + topSlides + '</div>' : '') +
      '<div style="margin-top:10px"><button class="linkbtn" data-act="personHistory" data-person="' + esc(p.name) + '">See their changes →</button></div></div>';
  }).join('') + '</div>';

}

/* ---------- Stats + charts ---------- */
function niceMax(v) { if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

function stackedBars(buckets) {
  const W = 960, H = 250, L = 40, R = 10, T = 10, B = 30;
  const pw = W - L - R, ph = H - T - B;
  const max = niceMax(Math.max(1, ...buckets.map(b => b.total)));
  const n = buckets.length, slot = pw / n, bw = Math.max(2, Math.min(26, slot * 0.7));
  let s = '<svg class="viz" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Changes over time">';
  for (let i = 0; i <= 5; i++) {
    const v = max / 5 * i, y = T + ph - v / max * ph;
    s += '<line class="gridl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + fmtN(v) + '</text>';
  }
  const every = Math.ceil(n / 12);
  buckets.forEach((b, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    let y = T + ph;
    const segs = SERIES.filter(se => b.v[se.key]);
    segs.forEach((se, k) => {
      let hgt = b.v[se.key] / max * ph;
      const gap = k > 0 ? 2 : 0;
      y -= hgt; hgt -= gap;
      if (hgt <= 0) return;
      if (k === segs.length - 1) {
        const r = Math.min(4, bw / 2, hgt);
        s += '<path fill="' + se.color + '" d="M' + x + ',' + (y + hgt) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y + ' ' + (x + bw) + ',' + (y + r) + 'V' + (y + hgt) + 'Z"/>';
      } else s += '<rect fill="' + se.color + '" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + hgt + '"/>';
    });
    if (i % every === 0) s += '<text x="' + (L + slot * i + slot / 2) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(b.label) + '</text>';
    const tip = '<b>' + esc(b.full) + '</b> · ' + b.total + ' changes' + SERIES.filter(se => b.v[se.key]).map(se =>
      '<div class=r><span><i style=background:' + se.color + '></i>' + se.name + '</span><b>' + b.v[se.key] + '</b></div>').join('');
    s += '<rect class="hit" x="' + (L + slot * i) + '" y="' + T + '" width="' + slot + '" height="' + ph + '" data-tip="' + esc(tip) + '"/>';
  });
  s += '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '"/></svg>';
  return s;
}

function hbars(items, opts) {
  const max = Math.max(1, ...items.map(it => it.segs.reduce((a, s) => a + s.n, 0)));
  return '<div class="hb">' + items.map(it => {
    const total = it.segs.reduce((a, s) => a + s.n, 0);
    return '<span class="lab" title="' + esc(it.label) + '">' + esc(it.label) + '</span><span class="track">' +
      it.segs.filter(s => s.n).map(s => '<i style="width:' + (s.n / max * 100) + '%;background:' + s.color + '" data-tip="<b>' + esc(it.label) + '</b><br>' + esc(s.name) + ': <b>' + s.n + '</b>"></i>').join('') +
      '</span><span class="val">' + fmtN(total) + '</span>';
  }).join('') + '</div>' + (opts && opts.legend ? legendHtml(opts.legend) : '');
}
function legendHtml(list) { return '<div class="legend" style="margin-top:10px">' + list.map(l => '<span><i style="background:' + l.color + '"></i>' + esc(l.name) + '</span>').join('') + '</div>'; }
function table(head, rows) {
  return '<table class="data"><thead><tr>' + head.map((h, i) => '<th' + (i ? ' class="n"' : '') + '>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map((c, i) => '<td' + (i ? ' class="n"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}

function renderStats() {
  const d = state.data;
  const rows = d.rows.filter(r => clsOf(r.change) !== 'note');
  const slidesTouched = new Set(rows.map(r => r.slideId).filter(Boolean)).size;
  let html = '<div class="kpis">' +
    [[rows.length, 'changes'], [d.commits.filter(c => c.changes.some(x => clsOf(x.change) !== 'note')).length, 'saves (check windows with edits)'],
     [d.people.length, 'contributors'], [slidesTouched, 'slides edited'], [d.checkpoints.length, 'checkpoints']]
      .map(([v, k]) => '<div class="kpi"><div class="v">' + fmtN(v) + '</div><div class="k">' + k + '</div></div>').join('') + '</div>';
  if (!rows.length) { $('#view').innerHTML = html + '<div class="box empty">No changes to chart yet.</div>'; return; }

  // buckets: by day, or by week when the history is long
  const t0 = Math.min(...rows.map(r => r.t)), t1 = Date.now();
  const days = Math.max(1, Math.ceil((t1 - t0) / 864e5) + 1);
  const weekly = days > 70;
  const start = new Date(t0); start.setHours(0, 0, 0, 0); if (weekly) start.setDate(start.getDate() - start.getDay());
  const step = weekly ? 7 : 1;
  const minBuckets = 7;   // short histories: show a few empty days BEFORE, never days in the future
  const span = Math.floor((t1 - start.getTime()) / (864e5 * step)) + 1;
  if (span < minBuckets) start.setDate(start.getDate() - (minBuckets - span) * step);
  const buckets = [];
  for (const dt = new Date(start); dt.getTime() <= t1; dt.setDate(dt.getDate() + step)) {
    buckets.push({ t: dt.getTime(), v: {}, total: 0,
      label: dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
      full: (weekly ? 'Week of ' : '') + dt.toLocaleDateString(undefined, { weekday: weekly ? undefined : 'short', month: 'short', day: 'numeric' }) });
  }
  rows.forEach(r => {
    let i = Math.floor((r.t - start.getTime()) / (864e5 * step));
    i = Math.max(0, Math.min(buckets.length - 1, i));
    const k = clsOf(r.change); buckets[i].v[k] = (buckets[i].v[k] || 0) + 1; buckets[i].total++;
  });

  const byType = SERIES.map(se => ({ label: se.name, segs: [{ n: rows.filter(r => clsOf(r.change) === se.key).length, color: se.color, name: se.name }] }));
  const people = perPerson().map(p => ({ label: p.name, segs: [
    { n: p.confirmed, color: 'var(--s1)', name: 'Confirmed' }, { n: p.shared + p.probable, color: 'var(--s2)', name: 'Same window / probable' }] }));
  const slideCount = new Map();
  rows.forEach(r => { if (!r.slideId) return; const o = slideCount.get(r.slideId) || { n: 0, label: '' }; o.n++; o.label = slideName(r) + ' · ' + r.slideTitle; slideCount.set(r.slideId, o); });
  const topSlides = [...slideCount.values()].sort((a, b) => b.n - a.n).slice(0, 10).map(o => ({ label: o.label, segs: [{ n: o.n, color: 'var(--s1)', name: 'Changes' }] }));
  const hours = new Array(24).fill(0); rows.forEach(r => hours[new Date(r.t).getHours()]++);

  const T = state.statsTable;
  const card = (title, body, wide, extra) => '<div class="card chart' + (wide ? ' wide' : '') + '"><div class="cardh"><span class="t">' + title + '</span>' + (extra || '') + '</div><div class="cardb">' + body + '</div></div>';
  html += '<div class="row" style="justify-content:flex-end;margin-bottom:10px"><button class="btn sm" data-act="statsTable">' + (T ? '📊 Show charts' : '▦ Show as tables') + '</button></div><div class="charts">';
  html += card('Changes over time' + (weekly ? ' (per week)' : ' (per day)'),
    T ? table([weekly ? 'Week of' : 'Day'].concat(SERIES.map(s => s.name), ['Total']), buckets.filter(b => b.total).map(b => [b.full].concat(SERIES.map(s => b.v[s.key] || 0), [b.total])))
      : stackedBars(buckets) + legendHtml(SERIES), true);
  html += card('Changes by type', T ? table(['Type', 'Changes'], byType.map(b => [b.label, b.segs[0].n])) : hbars(byType));
  html += card('Changes by contributor', T ? table(['Person', 'Confirmed', 'Same window / probable'], people.map(p => [p.label, p.segs[0].n, p.segs[1].n]))
    : hbars(people, { legend: [{ name: 'Confirmed', color: 'var(--s1)' }, { name: 'Same window / probable', color: 'var(--s2)' }] }));
  html += card('Most-edited slides', T ? table(['Slide', 'Changes'], topSlides.map(s => [s.label, s.segs[0].n])) : hbars(topSlides));
  html += card('Busiest hours of the day', T ? table(['Hour', 'Changes'], hours.map((n, h) => [hourLabel(h), n]).filter(r => r[1]))
    : hourStrip(hours));
  html += '</div>';
  $('#view').innerHTML = html;
}
function hourLabel(h) { return (h % 12 || 12) + (h < 12 ? ' am' : ' pm'); }
function hourStrip(hours) {
  const max = Math.max(1, ...hours);
  const lvl = n => n === 0 ? 'var(--g0)' : ['var(--q1)', 'var(--q2)', 'var(--q3)', 'var(--q4)'][Math.min(3, Math.floor(n / max * 3.999))];
  return '<div style="display:grid;grid-template-columns:repeat(24,1fr);gap:3px">' + hours.map((n, h) =>
    '<div style="height:34px;border-radius:3px;background:' + lvl(n) + '" data-tip="<b>' + hourLabel(h) + '</b>: ' + n + ' changes"></div>').join('') +

/* ---------- Export ---------- */
async function doExport(fmt) {
  $('#exportPop').classList.add('hidden');
  let d = state.data;
  try {
    if (!state.demo && state.src) { setStatus('Downloading the full history…'); d = prepare(await getJSON(withParams(state.src, 'limit=all&_=' + Date.now()))); }
    if (!d) return;
    const name = (d.deck.title || 'slides').replace(/[^\w一-鿿 -]+/g, '').trim().replace(/\s+/g, '-') + '-history-' + new Date().toISOString().slice(0, 10);
    const cols = ['time', 'commit', 'editors', 'attrib', 'slideNum', 'slideTitle', 'slideId', 'elementId', 'element', 'change', 'details', 'before', 'after', 'geo'];
    const clean = d.all.map(r => { const o = {}; cols.forEach(c => { o[c] = r[c] == null ? '' : r[c]; }); return o; });
    let blob;
    if (fmt === 'json') {
      blob = new Blob([JSON.stringify({ deck: d.deck, exported: new Date().toISOString(), count: clean.length, edits: clean }, null, 2)], { type: 'application/json' });
    } else {
      const q = v => { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const csv = '﻿' + [cols.join(',')].concat(clean.map(o => cols.map(c => q(o[c])).join(','))).join('\r\n');
      blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name + '.' + fmt;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    setStatus('Exported ' + fmtN(clean.length) + ' entries as ' + fmt.toUpperCase() + '.');
  } catch (e) { setStatus('Export failed: ' + e.message, true); }
}

function openModal({ title, bodyHtml, confirmLabel, danger, onConfirm }) {

document.addEventListener('click', e => {
  if (!e.target.closest('#exportMenu')) $('#exportPop').classList.add('hidden');
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'toggle') {
    const id = b.dataset.commit;
    state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
    renderHistory(); fillLive();
  } else if (act === 'tab') { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (act === 'refresh') load(true);
  else if (act === 'settings') { state.data = null; renderWelcome(); }
  else if (act === 'saveSrc') {
    const v = ($('#srcInput').value || '').trim();
    if (!v) return;
    state.src = v; state.demo = false; saveSource(v); state.firstLoad = true; load(true);
  } else if (act === 'demo') { state.src = 'demo'; state.data = null; load(true); }

    e.stopPropagation();

    if (act === 'elHistory') state.f.element = b.dataset.el;
    if (act === 'slideHistory') state.f.slide = b.dataset.slide;
    if (act === 'personHistory') state.f.editor = b.dataset.person;
    state.tab = 'history';
    state.expanded = new Set(state.data.commits.filter(c => c.changes.some(matches)).map(c => c.id));
    render(); window.scrollTo(0, 0);
  } else if (act === 'clearEl') { state.f.element = ''; render(); }
  else if (act === 'compare') {
    e.stopPropagation();
    const k = b.dataset.key; state.compare.has(k) ? state.compare.delete(k) : state.compare.add(k);
    renderHistory(); fillLive();
  } else if (act === 'live') {
    e.stopPropagation(); state.liveOpen.add(b.dataset.key); renderHistory(); fillLive();
  } else if (act === 'addCheckpoint') askCheckpoint();
  else if (act === 'showCommit') {
    state.f = { editor: '', slide: '', type: '', q: '', element: '' };
    state.tab = 'history'; state.expanded.add(b.dataset.commit); render();
    const el = document.querySelector('.chead[data-commit="' + b.dataset.commit + '"]');
    if (el) el.scrollIntoView({ block: 'center' });
  }
  else if (act === 'closeModal') { if (!state.busy) $('#modalRoot').innerHTML = ''; }
  else if (act === 'exportMenu') $('#exportPop').classList.toggle('hidden');

  return { ok: true, name: body.name };
}

/* ---------- go ---------- */
state.src = getSource();
load(true);
})();
</script>
